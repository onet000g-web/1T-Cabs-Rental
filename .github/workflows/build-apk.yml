name: Build 1T Cabs Rental APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          echo "ZIP=$ZIP" >> $GITHUB_ENV
          echo "Found: $ZIP"

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          find extracted -maxdepth 3 -type f | head -50

      - name: Fix app name resource
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("extracted/1T_Cabs_Rental/app/src/main/res/values/strings.xml")
          text = p.read_text(encoding="utf-8")

          text = re.sub(
              r'<string\s+name="app_name"[^>]*>.*?</string>',
              '<string name="app_name">1T Cabs Rental</string>',
              text,
              count=1,
              flags=re.S
          )

          p.write_text(text, encoding="utf-8")
          PY

      - name: Build APK
        working-directory: extracted/1T_Cabs_Rental
        run: |
          gradle --version
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 1T-Cabs-Rental-APK
          path: extracted/1T_Cabs_Rental/app/build/outputs/apk/debug/app-debug.apk